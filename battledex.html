<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleDex · Battleground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="battledex.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="topbar-logo">Battle<span>ground</span></a>
    <p class="pixel-label">Hall of legends</p>
  </header>

  <main class="stage stage-wide">
    <section id="view-battledex" class="view" aria-labelledby="battledex-title">
      <div class="battledex-header">
        <div class="battledex-heading">
          <h1 id="battledex-title" class="battledex-title">
            BattleDex <span id="battledex-count" class="count-badge count-badge-big">0</span>
          </h1>
          <p class="hero-tagline">Every fight you've saved, ready for the trading card binder.</p>
        </div>
        <nav class="actions actions-inline" aria-label="BattleDex actions">
          <a href="index.html#recent" id="back-to-fight-btn" class="btn btn-cyan" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            Back to recent fight
          </a>
          <a href="index.html" id="battledex-new-fight-btn" class="btn btn-red">New fight</a>
        </nav>
      </div>

      <p id="battledex-empty" class="battledex-empty" hidden>
        The trophy shelf is empty! Step into the ring, start a fight, and hit "Save to BattleDex" to crown your first legend.
      </p>

      <ol id="battledex-list" class="battledex-list"></ol>
    </section>
  </main>
</body>
</html>
